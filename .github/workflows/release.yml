name: Build and Release PlatformIO

on:
  push:
    tags:
      - "v*"   # Runs when you push a tag like v1.0.0
  workflow_dispatch:   # Allows manual trigger from GitHub UI

permissions:
  contents: write   # Required to create releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python (needed for PlatformIO)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install PlatformIO
      - name: Install PlatformIO
        run: pip install platformio

      # Build all environments (or specify with `pio run -e <env>`)
      - name: Build firmware
        run: pio run

      # Upload compiled firmware as artifact
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ".pio/build/*/*.bin"

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Download artifact from build job
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware

      # Create GitHub Release and upload binaries
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "firmware/**/*.bin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
